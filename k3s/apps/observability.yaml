apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    description: "Single node Elastic stack (Elasticsearch, Kibana) for APM"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Skilldron/homelab-iac
    targetRevision: main
    path: k3s/manifests/observability
  destination:
    name: "in-cluster"
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The ECK CRDs may not exist yet on the first sync (installed by eck-operator)
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
