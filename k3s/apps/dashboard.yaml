apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.43.0
  destination:
    name: "in-cluster"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
