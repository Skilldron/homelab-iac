---
- name: Install required packages
  become: true
  ansible.builtin.package:
    name:
      - ca-certificates
      - tar
    state: present
    update_cache: true

- name: Create AdGuard Home group
  become: true
  ansible.builtin.group:
    name: "{{ adguard_home_group }}"
    system: true
    state: present

- name: Create AdGuard Home user
  become: true
  ansible.builtin.user:
    name: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    home: "{{ adguard_home_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create AdGuard Home directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ adguard_home_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ adguard_home_install_dir }}/bin"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ adguard_home_config_dir }}"
      owner: "{{ adguard_home_user }}"
      group: "{{ adguard_home_group }}"
      mode: "0750"
    - path: "{{ adguard_home_data_dir }}"
      owner: "{{ adguard_home_user }}"
      group: "{{ adguard_home_group }}"
      mode: "0750"

- name: Check AdGuard Home binary
  become: true
  ansible.builtin.stat:
    path: "{{ adguard_home_binary_path }}"
  register: adguard_home_binary_stat

- name: Read installed AdGuard Home version
  become: true
  ansible.builtin.command:
    argv:
      - "{{ adguard_home_binary_path }}"
      - --version
  register: adguard_home_installed_version_cmd
  changed_when: false
  when: adguard_home_binary_stat.stat.exists

- name: Normalize installed AdGuard Home version
  ansible.builtin.set_fact:
    adguard_home_installed_version: >-
      {{
        (adguard_home_installed_version_cmd.stdout ~ ' ' ~ adguard_home_installed_version_cmd.stderr)
        | regex_search('v?[0-9]+\\.[0-9]+\\.[0-9]+(?:-[A-Za-z0-9.]+)?')
        | default('', true)
        | regex_replace('^v', '')
      }}
  when: adguard_home_binary_stat.stat.exists

- name: Determine whether AdGuard Home must be installed
  ansible.builtin.set_fact:
    adguard_home_install_required: >-
      {{
        (not adguard_home_binary_stat.stat.exists)
        or (adguard_home_installed_version | default('') != adguard_home_version)
      }}

- name: Download Adguard Home binary
  become: true
  when: adguard_home_install_required
  block:
    - name: Create temporary workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: adguard-home-
      register: adguard_home_tmpdir

    - name: Download and extract AdGuard Home binary
      ansible.builtin.unarchive:
        src: "https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        dest: "{{ adguard_home_tmpdir.path }}"
        mode: "0755"
        remote_src: true
    - name: Install AdGuard Home binary
      ansible.builtin.copy:
        src: "{{ adguard_home_tmpdir.path }}/AdGuardHome/AdGuardHome"
        dest: "{{ adguard_home_binary_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart adguard-home
  always:
    - name: Remove temporary workspace
      ansible.builtin.file:
        path: "{{ adguard_home_tmpdir.path }}"
        state: absent
      when:
        - adguard_home_tmpdir is defined
        - adguard_home_tmpdir.path is defined

- name: Install systemd unit
  become: true
  ansible.builtin.template:
    src: adguard-home.service.j2
    dest: "/etc/systemd/system/{{ adguard_home_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart adguard-home

- name: Flush service handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start AdGuard Home
  become: true
  ansible.builtin.systemd_service:
    name: "{{ adguard_home_service_name }}"
    enabled: true
    state: started
