---
# tasks file for harold.bootstrap
- name: Update apt cache
  become: true
  ansible.builtin.package:
    update_cache: true
- name: Install basics packages
  become: true
  ansible.builtin.package:
    name:
      - unzip
      - curl
      - sudo
      - git
      - gnupg
      - zsh
      - htop
      - vim
      - neovim
      - fzf
    update_cache: true
    state: present

- name: Initialize LXC base configuration
  when: bootstrap_lxc_init | bool
  block:
    - name: Check root authorized keys file exists
      become: true
      ansible.builtin.stat:
        path: /root/.ssh/authorized_keys
      register: bootstrap_root_authorized_keys_stat

    - name: Fail when root authorized keys file is missing
      ansible.builtin.fail:
        msg: >-
          LXC init requires /root/.ssh/authorized_keys to exist so keys can be
          copied to bootstrap users.
      when: not bootstrap_root_authorized_keys_stat.stat.exists

    - name: Read root authorized keys
      become: true
      ansible.builtin.slurp:
        path: /root/.ssh/authorized_keys
      register: bootstrap_root_authorized_keys_file

    - name: Build root authorized keys list
      ansible.builtin.set_fact:
        bootstrap_root_authorized_keys: >-
          {{
            (bootstrap_root_authorized_keys_file.content | b64decode).splitlines()
            | map('trim')
            | reject('equalto', '')
            | reject('match', '^#')
            | list
          }}

    - name: Fail when no usable root authorized key is found
      ansible.builtin.fail:
        msg: No usable SSH public key found in /root/.ssh/authorized_keys.
      when: bootstrap_root_authorized_keys | length == 0

    - name: Ensure bootstrap users exist
      become: true
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
        create_home: true
        shell: /bin/bash
        groups: sudo
        append: true
      loop: "{{ bootstrap_lxc_users }}"

    - name: Build user and key pairs for authorized_keys
      ansible.builtin.set_fact:
        bootstrap_user_authorized_key_pairs: "{{ bootstrap_lxc_users |
          product(bootstrap_root_authorized_keys) | list }}"

    - name: Install SSH keys for bootstrap users
      become: true
      ansible.posix.authorized_key:
        user: "{{ item.0 }}"
        key: "{{ item.1 }}"
        state: present
        manage_dir: true
      loop: "{{ bootstrap_user_authorized_key_pairs }}"

    - name: Configure passwordless sudo for bootstrap users
      become: true
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-bootstrap-users
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          {% for user in bootstrap_sudo_nopasswd_users %}
          {{ user }} ALL=(ALL) NOPASSWD:ALL
          {% endfor %}

    - name: Set timezone
      become: true
      ansible.builtin.timezone:
        name: "{{ bootstrap_timezone }}"

    - name: Deploy SSH hardening drop-in configuration
      become: true
      ansible.builtin.template:
        src: 99-bootstrap-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-bootstrap-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
      when: bootstrap_ssh_hardening | bool

- name: Get all system users
  ansible.builtin.getent:
    database: passwd

- name: Select users with bash shells
  ansible.builtin.set_fact:
    bootstrap_bash_users: |
      {{
        getent_passwd
        | dict2items
        | selectattr('value', 'contains', '/bin/bash')
        | map(attribute='key')
      }}

- name: Select users with zsh shells
  ansible.builtin.set_fact:
    bootstrap_zsh_users: |
      {{
        getent_passwd
        | dict2items
        | selectattr('value', 'contains', '/bin/zsh')
        | map(attribute='key')
      }}

- name: Install Zinit for each user
  become: false
  become_user: "{{ item }}"
  ansible.builtin.shell: |
    set -e
    ZINIT_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/zinit/zinit.git"
    if [ ! -d "$ZINIT_HOME/.git" ]; then
      git clone https://github.com/zdharma-continuum/zinit.git "$ZINIT_HOME"
    fi
  args:
    creates: "{{ lookup('ansible.builtin.env', 'HOME')
      }}/.local/share/zinit/zinit.git/zinit.zsh"
  loop: "{{ bootstrap_zsh_users + bootstrap_bash_users }}"

- name: Set Zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/zsh
  loop: "{{ bootstrap_zsh_users + bootstrap_bash_users }}"

- name: Deploy .zshrc
  become: true
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ getent_passwd[item][4] }}/.zshrc"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0644"
  loop: "{{ bootstrap_zsh_users + bootstrap_bash_users }}"
  when: item != "root"
