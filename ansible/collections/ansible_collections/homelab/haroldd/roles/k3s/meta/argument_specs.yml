---
# argument spec file for homelab.haroldd.k3s

argument_specs:
  main:
    short_description: Install and configure K3S (server or agent) and kubectl.
    options:
      k3s_role:
        type: str
        description: Node role. "server" for a control-plane node, "agent" to join an existing cluster.
        choices:
          - server
          - agent
        default: server
      k3s_version:
        type: str
        description: K3S version to install. Empty means latest stable, e.g. "v1.30.2+k3s1".
        default: ""
      k3s_server_url:
        type: str
        description: URL of an existing K3S server. Required when k3s_role is "agent", e.g. "https://192.168.1.10:6443".
        default: ""
      k3s_token:
        type: str
        description: Node-token used by an agent to join the cluster. Required when k3s_role is "agent".
        default: ""
      k3s_kubectl_version:
        type: str
        description: kubectl version to install. "latest" resolves the current stable release, or pin e.g. "v1.27.4".
        default: latest
      k3s_home_user:
        type: str
        description: Home directory of the user whose ~/.zshrc receives kubectl completion.
        default: /home/ubuntu
