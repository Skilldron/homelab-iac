---
- name: Install K3S server (control-plane)
  hosts: k3s_master
  roles:
    - role: homelab.haroldd.k3s # k3s_role defaults to "server"

- name: Fetch the cluster join token from the server
  hosts: k3s_master
  become: true
  tasks:
    - name: Read K3S node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token

    - name: Expose the join token as a host fact
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_node_token.content | b64decode | trim }}"

- name: Install K3S agents (join the cluster)
  hosts: k3s_worker
  vars:
    k3s_role: agent
    k3s_server_url: "https://{{ hostvars[groups['k3s_master'][0]].ansible_host }}:{{ k3s_api_port | default(6443) }}"
    k3s_token: "{{ hostvars[groups['k3s_master'][0]].k3s_join_token }}"
  roles:
    - role: homelab.haroldd.k3s
